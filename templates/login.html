{% extends "base.html" %}

{% block title %}Login - AML System{% endblock %}

{% block content %}
<div class="login-body">
    <div class="login-card">
        <div class="login-logo">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            <span>AML System</span>
        </div>
        
        <h2 style="font-size: 1.25rem; font-weight: 600; text-align: center; margin-bottom: 1.5rem; color: var(--primary);">Security Portal Sign In</h2>
        
        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="e.g. analyst" required autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Authenticate</button>
        </form>
    </div>
</div>
{% endblock %}
